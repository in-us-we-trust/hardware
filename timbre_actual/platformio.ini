[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; Habilitar la PSRAM tipo OPI (Octal)
board_build.arduino.memory_type = qio_opi
; Banderas de compilación para USB CDC Nativo y PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Ajustes del Monitor Serial
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
lib_deps = bblanchon/ArduinoJson@^7.2.2
