<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timbre - Esperando llamada</title>
    <style>
      body {
        margin: 0;
        background: #0b1020;
        color: white;
        font-family: Arial, sans-serif;
      }
      .panel {
        max-width: 760px;
        margin: 24px auto;
        padding: 20px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .status {
        padding: 12px 16px;
        background: #111827;
        border-radius: 10px;
        border: 1px solid #2a3447;
        font-weight: bold;
      }
      .stream-box {
        width: min(34vw, 420px);
        max-width: 100%;
        height: auto;
        aspect-ratio: 4 / 3;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        border: 1px solid #2a3447;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 18px auto 0;
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        background: #000;
      }
      button {
        background: #dc2626;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
      }
      input {
        width: 220px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="topbar">
        <h2>Timbre - Esperando llamada</h2>
        <div class="status" id="status">Esperando que el timbre toque el botón…</div>
      </div>

      <div class="topbar">
        <label>
          ESP32:
          <input id="espUrl" value="http://192.168.1.46:8081" />
        </label>
        <button id="hangupBtn" type="button">Colgar</button>
      </div>

      <div class="stream-box">
        <img id="streamImage" alt="Video del timbre" src="" />
      </div>
    </div>

    <script>
      const espUrlInput = document.getElementById('espUrl');
      const statusEl = document.getElementById('status');
      const streamImage = document.getElementById('streamImage');
      const hangupBtn = document.getElementById('hangupBtn');

      function setStatus(text) {
        statusEl.textContent = text;
      }

      let refreshTimer = null;
      let callActive = false;

      function clearStreamPreview() {
        streamImage.removeAttribute('src');
        streamImage.src = '';
      }

      function startPolling() {
        if (refreshTimer) {
          clearInterval(refreshTimer);
        }
        refreshTimer = setInterval(() => {
          const base = espUrlInput.value.trim().replace(/\/$/, '');
          const streamUrl = `${base}/stream?ts=${Date.now()}`;
          streamImage.src = streamUrl;
        }, 250);
      }

      function stopPolling() {
        if (refreshTimer) {
          clearInterval(refreshTimer);
          refreshTimer = null;
        }
      }

      streamImage.addEventListener('error', () => {
        callActive = false;
        setStatus('Esperando llamada… el timbre aún no comenzó la transmisión.');
        startPolling();
      });

      streamImage.addEventListener('load', () => {
        callActive = true;
        setStatus('Llamada activa. El timbre está transmitiendo video.');
        startPolling();
      });

      hangupBtn.addEventListener('click', async () => {
        const base = espUrlInput.value.trim().replace(/\/$/, '');
        try {
          setStatus('Cortando llamada…');
          callActive = false;
          clearStreamPreview();
          stopPolling();
          await fetch(`${base}/hangup`, { mode: 'cors' });
          setStatus('Llamada finalizada. El timbre volvió a reposo.');
          startPolling();
        } catch (err) {
          setStatus('No se pudo cortar la llamada desde la PC.');
          console.error(err);
          startPolling();
        }
      });

      startPolling();
    </script>
  </body>
</html>
