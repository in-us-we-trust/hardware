[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
; Habilitar la PSRAM tipo OPI (Octal)
board_build.arduino.memory_type = qio_opi
; Banderas de compilación para USB CDC Nativo y PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Identidad del timbre. Tiene que ser IGUAL al CN de lib/Certs/certs/device.pem
    ; (Mosquitto usa el CN como username y el ACL solo permite home/<CN>/#).
    -DDEVICE_ID='"f6d44bb5-7f59-4635-bc53-f7d7eb0c1f9f"'
    ; MQTTS (mTLS) contra Mosquitto de la VM (profile secure de microcontroller-communication)
    ; -DMQTT_BROKER_HOST='"35.192.178.189"'
    -DMQTT_BROKER_HOST='"192.168.1.69"'
    -DMQTT_BROKER_PORT=8883
    ; nombre con el que se valida el server cert (ver Config.h)
    -DMQTT_TLS_HOSTNAME='"localhost"'
    ; lab viejo (broker plano, ya no soportado por MqttClient):
    ; -DMQTT_BROKER_HOST='"192.168.1.69"'
    ; -DMQTT_BROKER_PORT=1883
    ; -DMQTT_BROKER_HOST='"bore.pub"'
    ; -DMQTT_BROKER_PORT=25076
    ; -DMQTT_BROKER_HOST='"136.119.178.77"'
    ; -DMQTT_BROKER_PORT=1883 
    ; RTSPS contra MediaMTX de la VM (profile secure). User = DEVICE_ID.
    ; -DMEDIAMTX_HOST='"35.192.178.189"'
    -DMEDIAMTX_HOST='"192.168.1.69"'
    -DMEDIAMTX_PORT=8322
    -DMEDIAMTX_TLS_HOSTNAME='"localhost"'
    ; pass del device en authInternalUsers (mediamtx.secure.yml)
    -DMEDIAMTX_PASS='"fiuba-rtsp-writer-1"'
    ; lab viejo (RTSP plano, ya no soportado por RtspPublisher):
    ; -DMEDIAMTX_HOST='"192.168.1.69"'
    ; -DMEDIAMTX_PORT=8554
    ; -DAUDIO_TEST_MODE

    -DMQTT_BUFFER_SIZE=200000

    ; --- Seeding de WiFi para la placa real (opcional) ----------------------
    ; NO commitear credenciales reales. Descomentá y completá localmente solo
    ; si necesitás sembrar el NVS sin BLE/portal; borralas antes de pushear.
    ; -DSEED_WIFI_SSID='"MiRed"'
    ; -DSEED_WIFI_PASS='"MiPassword"'
    ; -DSEED_WIFI_REGISTERED=1
; Ajustes del Monitor Serial
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
lib_deps = 
    bblanchon/ArduinoJson@^7.2.2
    256dpi/MQTT@^2.5.2
    spaziochirale/Chirale_TensorFlowLite

; Build para el simulador de Wokwi. Wokwi no simula ni el modo AP ni BLE ni la
; camara, asi que WOKWI_SIM sirve la pagina del QR por STA (Wokwi-GUEST) y saltea
; lo que no existe en el simulador. No afecta al build de produccion.
[env:wokwi]
extends = env:seeed_xiao_esp32s3
build_flags =
    ${env:seeed_xiao_esp32s3.build_flags}
    -DWOKWI_SIM

; Igual que [env:wokwi] pero sembrando el NVS al arrancar, porque Wokwi empieza
; con la flash vacia en cada corrida. Sirve para ejercitar la rama "ya
; provisionado" sin tener que vincular por BLE (que el simulador no soporta).
; Cambia los valores aca, no en el codigo.
[env:wokwi_provisioned]
extends = env:wokwi
build_flags =
    ${env:wokwi.build_flags}
    -DSEED_WIFI_SSID='"Wokwi-GUEST"'
    -DSEED_WIFI_PASS='""'
    ; 1 = el device ya figura registrado en el gateway; 0 = registra al vincular
    -DSEED_WIFI_REGISTERED=1
